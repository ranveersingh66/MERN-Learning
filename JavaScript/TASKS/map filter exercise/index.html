<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>map filter exercise</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #ffffff;
      padding: 30px;
    }

    /* Main Grid Container */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      max-width: 1100px;
      margin: 0 auto;
    }

    /* Individual Student Card */
    .card {
      background-color: #f4f4f6;
      border-radius: 10px;
      padding: 20px 24px;
    }

    /* Text Styling */
    .card p {
      font-size: 14px;
      color: #222222;
      margin-bottom: 12px;
      font-weight: 500;
    }

    .card p:last-child {
      margin-bottom: 0;
    }

    .card span {
      color: #777777;
      font-weight: 400;
      margin-right: 4px;
    }

  </style>
</head>
<body>

  <div class="card-grid">
    <!-- Card 1 -->
    <div class="card" id="card-1">
    </div>

    <!-- Card 2 -->
    <div class="card">
    </div>

    <!-- Card 3 -->
    <div class="card">
    </div>

    <!-- Card 4 -->
    <div class="card">
    </div>

    <!-- Card 5 -->

    </div>

    <!-- Card 6 -->

    <!-- Card 7 -->

    <!-- Card 8 -->

    </div>

    <!-- Card 9 -->
    <div class="card">
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
